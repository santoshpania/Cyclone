name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 5s --health-retries 30
    defaults:
      run:
        working-directory: backend
    env:
      CYCLONE_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/cyclone_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy app
      - run: uv run pytest

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  contract:
    name: API client drift + industry terms
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: ./scripts/check_no_industry_terms.sh
      - run: cd backend && uv sync --frozen && uv run python scripts/export_openapi.py ../web/openapi.json
      - run: cd web && pnpm install --frozen-lockfile && pnpm gen:api
      - name: Fail if the committed client is stale (run `make gen-api`)
        run: git diff --exit-code -- web/openapi.json web/src/lib/api/schema.d.ts
