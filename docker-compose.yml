# Local development database. Supabase provides the same Postgres + PostGIS in production.
services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cyclone
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cyclone"]
      interval: 2s
      retries: 30
volumes:
  pgdata:
